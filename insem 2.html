
<!DOCTYPE html>
<html>
<head>
<title>My Shopping Website</title>
<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f2f2f2;
}
header {
    background: #172554;
    color: white;
    padding: 20px;
    text-align: center;
}
nav {
    background: #1e40af;
    padding: 15px;
    text-align: center;
}
nav a {
    color: white;
    text-decoration: none;
    margin: 20px;
    font-weight: bold;
}
.container {
    padding: 25px;
}
.products {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
    gap: 20px;
}
.product {
    background: white;
    padding: 15px;
    text-align: center;
    border-radius: 10px;
}
.product img {
    width: 100%;
    height: 150px;
    object-fit: contain;
}
button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 5px;
}
button:hover {
    background: #1e3a8a;
}
#cartItems {
    background: white;
    padding: 20px;
    border-radius: 10px;
}
.cart-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #ddd;
    padding: 12px;
}
.hidden {
    display: none;
}
</style>
</head>

<body>

<header>
    <h1>MY SHOPPING STORE</h1>
    <p>Welcome to Online Shopping</p>
</header>

<nav>
    <a href="#" onclick="showShop()">Shop</a>
    <a href="#" onclick="showCart()">Go to Cart 🛒
        (<span id="cartCount">0</span>)
    </a>
</nav>

<div class="container">

<!-- SHOP PAGE -->
<section id="shopPage">
    <h2>Our Products</h2>

    <div class="products">

        <div class="product">
            <img src="https://placehold.co/200x150?text=Shoes">
            <h3>Sports Shoes</h3>
            <p>₹1200</p>
            <button onclick="addToCart(1)">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/200x150?text=Watch">
            <h3>Smart Watch</h3>
            <p>₹2000</p>
            <button onclick="addToCart(2)">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/200x150?text=Headphones">
            <h3>Headphones</h3>
            <p>₹800</p>
            <button onclick="addToCart(3)">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://placehold.co/200x150?text=Bag">
            <h3>School Bag</h3>
            <p>₹1000</p>
            <button onclick="addToCart(4)">Add to Cart</button>
        </div>

    </div>

    <br>
    <button onclick="showCart()">Go to Cart 🛒</button>
</section>

<!-- CART PAGE -->
<section id="cartPage" class="hidden">
    <h2>Shopping Cart 🛒</h2>

    <div id="cartItems"></div>

    <h2 id="total">Total: ₹0</h2>

    <button onclick="showShop()">Continue Shopping</button>
    <button onclick="clearCart()">Clear Cart</button>
</section>

</div>

<script>
const products = [
    {id:1, name:"Sports Shoes", price:1200},
    {id:2, name:"Smart Watch", price:2000},
    {id:3, name:"Headphones", price:800},
    {id:4, name:"School Bag", price:1000}
];

let cart = JSON.parse(localgit remote add origin https://github.com/2500032602/labinsem-2.git

function addToCart(id) {
    let item = cart.find(p => p.id === id);

    if(item) {
        item.quantity++;
    } else {
        cart.push({id:id, quantity:1});
    }

    saveCart();
    alert("Product added to cart!");
}

function updateCount() {
    let count = cart.reduce((sum,p) => sum + p.quantity, 0);
    document.getElementById("cartCount").innerText = count;
}

function showShop() {
    document.getElementById("shopPage").classList.remove("hidden");
    document.getElementById("cartPage").classList.add("hidden");
}

function showCart() {
    document.getElementById("shopPage").classList.add("hidden");
    document.getElementById("cartPage").classList.remove("hidden");
    displayCart();
}

function displayCart() {
    let box = document.getElementById("cartItems");
    let total = 0;

    if(cart.length === 0) {
        box.innerHTML = "<h3>Your cart is empty!</h3>";
        document.getElementById("total").innerText = "Total: ₹0";
        return;
    }

    box.innerHTML = "";

    cart.forEach(item => {
        let product = products.find(p => p.id === item.id);
        if (!product) return;

        let amount = product.price * item.quantity;
        total += amount;

        box.innerHTML += `
        <div class="cart-item">
            <div>
                <h3>${product.name}</h3>
                <p>₹${product.price} × ${item.quantity} = ₹${amount}</p>
            </div>
            <div>
                <button onclick="changeQty(${item.id},-1)">-</button>
                ${item.quantity}
                <button onclick="changeQty(${item.id},1)">+</button>
                <button onclick="removeItem(${item.id})">Remove</button>
            </div>
        </div>`;
    });

    document.getElementById("total").innerText =
        "Total: ₹" + total;
}

function changeQty(id, change) {
    let item = cart.find(p => p.id === id);

    if(item) {
        item.quantity += change;

        if(item.quantity <= 0) {
            cart = cart.filter(p => p.id !== id);
        }
    }

    saveCart();
    displayCart();
}

function removeItem(id) {
    cart = cart.filter(p => p.id !== id);
    saveCart();
    displayCart();
}

function clearCart() {
    cart = [];
    saveCart();
    displayCart();
}

updateCount();
</script>

</body>
</html>
